server {
    listen 80;
    server_name 124.220.147.193;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/studyloop/acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://124.220.147.193$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 124.220.147.193;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/124.220.147.193/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.220.147.193/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
